<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- PÁGINA DE ERROR: MUESTRA DE FORMA COMPRENSIBLE UN ID NO ENCONTRADO. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>No encontrado | Cuadernos y notas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: navbar}"></div>
<main class="container">
    <div class="alert alert-warning">
        <h1 class="h4">No se ha encontrado el registro</h1>
        <p class="mb-3" th:text="${mensajeError}"></p>
        <a class="btn btn-outline-primary" th:href="@{/}">Volver al inicio</a>
    </div>
</main>
</body>
</html>
