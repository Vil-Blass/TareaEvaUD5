<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- CONFIRMACIÓN DE BORRADO: ACLARA QUE SOLO SE ELIMINA UNA NOTA. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eliminar nota | Cuadernos y notas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: navbar}"></div>
<main class="container" style="max-width: 760px">
    <section class="card card-body border-danger shadow-sm">
        <h1 class="h3 text-danger">Eliminar nota</h1>
        <p>¿Seguro que quieres eliminar la nota <strong th:text="${nota.titulo}"></strong> del cuaderno
            <strong th:text="${nota.cuaderno.nombre}"></strong>?</p>
        <p class="alert alert-warning mb-3">Solo se eliminará esta nota; el cuaderno y las demás notas se conservarán.</p>
        <form th:action="@{/notas/{id}/eliminar(id=${nota.id})}" method="post" class="d-flex gap-2">
            <button class="btn btn-danger" type="submit">Confirmar eliminación</button>
            <a class="btn btn-outline-secondary" th:href="@{/notas}">Cancelar</a>
        </form>
    </section>
</main>
</body>
</html>
