<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- FORMULARIO DE NOTA: PERMITE CREAR O CAMBIAR EL CUADERNO RELACIONADO. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${tituloPagina} + ' | Cuadernos y notas'">Nota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: alerts}"></div>
<main class="container" style="max-width: 760px">
    <h1 class="h2 mb-4" th:text="${tituloPagina}"></h1>
    <div th:if="${aviso}" class="alert alert-warning" th:text="${aviso}"></div>
    <form th:action="${accion}" th:object="${notaForm}" method="post" class="card card-body shadow-sm">
        <div class="mb-3">
            <label for="titulo" class="form-label">Título</label>
            <input id="titulo" class="form-control" th:field="*{titulo}" maxlength="120" required>
            <div class="text-danger small" th:errors="*{titulo}"></div>
        </div>
        <div class="mb-3">
            <label for="contenido" class="form-label">Contenido</label>
            <textarea id="contenido" class="form-control" th:field="*{contenido}" rows="5" maxlength="2000" required></textarea>
            <div class="text-danger small" th:errors="*{contenido}"></div>
        </div>
        <div class="mb-3">
            <label for="cuadernoId" class="form-label">Cuaderno</label>
            <select id="cuadernoId" class="form-select" th:field="*{cuadernoId}" required>
                <option value="">Selecciona un cuaderno</option>
                <option th:each="cuaderno : ${cuadernos}" th:value="${cuaderno.id}" th:text="${cuaderno.nombre}"></option>
            </select>
            <div class="text-danger small" th:errors="*{cuadernoId}"></div>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/notas}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
