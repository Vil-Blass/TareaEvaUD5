<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- LISTADO DE NOTAS: TAMBIÉN MUESTRA EL NOMBRE DEL CUADERNO RELACIONADO. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notas | Cuadernos y notas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: alerts}"></div>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div><h1 class="h2 mb-1">Notas</h1><p class="text-secondary mb-0">Cada nota pertenece a un cuaderno.</p></div>
        <a class="btn btn-primary" th:href="@{/notas/nueva}">Nueva nota</a>
    </div>
    <div th:if="${#lists.isEmpty(notas)}" class="alert alert-info">Todavía no hay notas.</div>
    <div th:unless="${#lists.isEmpty(notas)}" class="table-responsive bg-white rounded shadow-sm">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>Título</th><th>Contenido</th><th>Cuaderno</th><th class="text-end">Acciones</th></tr></thead>
            <tbody>
            <tr th:each="nota : ${notas}">
                <td class="fw-semibold" th:text="${nota.titulo}"></td>
                <td th:text="${nota.contenido}"></td>
                <td th:text="${nota.cuaderno.nombre}"></td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/notas/{id}/editar(id=${nota.id})}">Editar</a>
                    <a class="btn btn-sm btn-outline-danger" th:href="@{/notas/{id}/eliminar(id=${nota.id})}">Eliminar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
