<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- CONFIRMACIÓN DE BORRADO: EXPLICAN CASCADA ANTES DE ENVIAR EL POST. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eliminar cuaderno | Cuadernos y notas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: navbar}"></div>
<main class="container" style="max-width: 760px">
    <section class="card card-body border-danger shadow-sm">
        <h1 class="h3 text-danger">Eliminar cuaderno</h1>
        <p>¿Seguro que quieres eliminar el cuaderno <strong th:text="${cuaderno.nombre}"></strong>?</p>
        <p class="alert alert-warning mb-3">
            También se eliminarán sus <strong th:text="${#lists.size(cuaderno.notas)}"></strong> notas.
            Esta acción no se puede deshacer.
        </p>
        <form th:action="@{/cuadernos/{id}/eliminar(id=${cuaderno.id})}" method="post" class="d-flex gap-2">
            <button class="btn btn-danger" type="submit">Confirmar eliminación</button>
            <a class="btn btn-outline-secondary" th:href="@{/cuadernos}">Cancelar</a>
        </form>
    </section>
</main>
</body>
</html>
