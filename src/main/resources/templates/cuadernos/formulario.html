<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- FORMULARIO DE CUADERNO: SE REUTILIZA PARA CREAR Y EDITAR SIN DUPLICAR FILAS. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${tituloPagina} + ' | Cuadernos y notas'">Cuaderno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: alerts}"></div>
<main class="container" style="max-width: 760px">
    <h1 class="h2 mb-4" th:text="${tituloPagina}"></h1>
    <form th:action="${accion}" th:object="${cuadernoForm}" method="post" class="card card-body shadow-sm">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input id="nombre" class="form-control" th:field="*{nombre}" maxlength="80" required>
            <div class="text-danger small" th:errors="*{nombre}"></div>
        </div>
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea id="descripcion" class="form-control" th:field="*{descripcion}" rows="4" maxlength="500" required></textarea>
            <div class="text-danger small" th:errors="*{descripcion}"></div>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/cuadernos}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
