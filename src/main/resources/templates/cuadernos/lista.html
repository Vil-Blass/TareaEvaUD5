<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- LISTADO DE CUADERNOS: MUESTRA NOMBRE, DESCRIPCIÓN, NOTAS Y ACCIONES. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cuadernos | Cuadernos y notas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: alerts}"></div>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div><h1 class="h2 mb-1">Cuadernos</h1><p class="text-secondary mb-0">Organiza notas por tema.</p></div>
        <a class="btn btn-primary" th:href="@{/cuadernos/nuevo}">Nuevo cuaderno</a>
    </div>
    <div th:if="${#lists.isEmpty(cuadernos)}" class="alert alert-info">Todavía no hay cuadernos. Crea uno para empezar.</div>
    <div th:unless="${#lists.isEmpty(cuadernos)}" class="table-responsive bg-white rounded shadow-sm">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>Nombre</th><th>Descripción</th><th>Notas</th><th class="text-end">Acciones</th></tr></thead>
            <tbody>
            <tr th:each="cuaderno : ${cuadernos}">
                <td class="fw-semibold" th:text="${cuaderno.nombre}"></td>
                <td th:text="${cuaderno.descripcion}"></td>
                <td th:text="${#lists.size(cuaderno.notas)}"></td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/cuadernos/{id}/editar(id=${cuaderno.id})}">Editar</a>
                    <a class="btn btn-sm btn-outline-danger" th:href="@{/cuadernos/{id}/eliminar(id=${cuaderno.id})}">Eliminar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
