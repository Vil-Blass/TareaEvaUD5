<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- PÁGINA DE INICIO: PRESENTA EL ACCESO A LOS DOS CRUD Y SUS CONTADORES. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio | Cuadernos y notas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: navbar}"></div>
<main class="container">
    <section class="p-5 mb-4 bg-white rounded-3 shadow-sm">
        <h1 class="display-6">Organiza tus ideas</h1>
        <p class="lead mb-4">Guarda notas dentro de cuadernos temáticos y administra su contenido.</p>
        <a class="btn btn-primary me-2" th:href="@{/cuadernos}">Gestionar cuadernos</a>
        <a class="btn btn-outline-primary" th:href="@{/notas}">Gestionar notas</a>
    </section>
    <div class="row g-3">
        <div class="col-md-6">
            <div class="card shadow-sm"><div class="card-body">
                <h2 class="h5">Cuadernos</h2>
                <p class="display-6 mb-0" th:text="${numeroCuadernos}">0</p>
            </div></div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm"><div class="card-body">
                <h2 class="h5">Notas</h2>
                <p class="display-6 mb-0" th:text="${numeroNotas}">0</p>
            </div></div>
        </div>
    </div>
</main>
</body>
</html>
