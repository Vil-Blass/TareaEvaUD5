# CONFIGURACIÓN DE NOMBRE Y ARRANQUE DE SPRING BOOT.
spring.application.name=ad05-cuadernos
# URL JDBC de Oracle; DB_URL permite cambiar el servicio sin modificar el código.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
# CREDENCIALES EXTERNAS: NO SE GUARDAN CONTRASEÑAS REALES EN ESTE ARCHIVO.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# UPDATE CREA O ACTUALIZA LAS TABLAS A PARTIR DE LAS ENTIDADES JPA.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
